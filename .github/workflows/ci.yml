name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pretrained backbones (torchvision ResNet/WRN, DINOv2 from Hugging Face) are cached
      # between runs so the model tests do not re-download ~1 GB each time.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: weights-${{ hashFiles('src/inference/anomaly/backbones.py') }}

      - name: Install dependencies (CPU build of PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(#|torch|torchvision)' requirements.in > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt

      - name: Style and types
        run: ruff check . && mypy

      - name: Tests
        run: python -m pytest -q --durations=15 --cov=src --cov-report=term | tail -120

      - name: Known vulnerabilities
        continue-on-error: true      # reported, and does not block a fix
        run: pip-audit --disable-pip -r requirements.txt --require-hashes
