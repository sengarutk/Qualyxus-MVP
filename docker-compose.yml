x-station: &station
  build: .
  image: qualyxus
  network_mode: host
  restart: unless-stopped
  stop_signal: SIGINT
  stop_grace_period: 60s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    - ./secrets:/app/secrets     # keys and accounts must outlive the container
    - ./config.yaml:/app/config.yaml:ro

services:
  runtime:
    <<: *station
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  console:
    <<: *station
    # On this machine only. For the network, with accounts and a certificate:
    #   python -m src.console --host 0.0.0.0 --tls-cert secrets/tls/cert.pem --tls-key secrets/tls/key.pem
    command: python -m src.console
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8600/api/me', timeout=5)"], interval: 30s, timeout: 10s}
