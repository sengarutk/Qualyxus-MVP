# Simulated six-view station: every face of each part is inspected, and a defect sits on a
# single face, so a part only passes once all six views have seen it. Run with:
#   CONFIG_PATH=config.360.yaml python main.py
#   CONFIG_PATH=config.360.yaml streamlit run src/dashboard/app.py
extends: config.yaml

# Every face looks different, so each has its own model (camera model_view + recipes below),
# calibrated so false rejects hold per part across all six views. For face 0 to 5:
#   python -m src.inference.anomaly.train --synthetic 300 --face 0 --register --backbone dinov2_vits14 --out models/anomaly/base_0.pt
#   python -m src.inference.anomaly.recalibrate --model models/anomaly/base_0.pt --synthetic 720 --face 0 --views 6 \
#       --out models/anomaly/face_top.pt
inspection:
  anomaly_model: null
  recipes:
    default-top: {anomaly_model: "models/anomaly/face_top.pt"}
    default-bottom: {anomaly_model: "models/anomaly/face_bottom.pt"}
    default-front: {anomaly_model: "models/anomaly/face_front.pt"}
    default-back: {anomaly_model: "models/anomaly/face_back.pt"}
    default-left: {anomaly_model: "models/anomaly/face_left.pt"}
    default-right: {anomaly_model: "models/anomaly/face_right.pt"}

process:
  simulator:
    time_scale: 3.0

x-view: &view
  enabled: true
  required_view: true
  source: "synthetic://view"
  mock_inference: true
  synthetic_scene: "process"
  part_dwell_s: 0.6
  independent_logs: true
  fps: 15
  width: 640
  height: 480
  n_views: 6
  inject_defect_every: 5    # demo only: a defect on every 5th part, rotating through the faces
  process_link:
    machine_id: "imm_1"
    mode: "time"
    transport_delay_s: 4.0
    tolerance_s: 2.0

cameras:
  - {<<: *view, id: "view_top", model_view: "top", view_index: 0}
  - {<<: *view, id: "view_bottom", model_view: "bottom", view_index: 1}
  - {<<: *view, id: "view_front", model_view: "front", view_index: 2}
  - {<<: *view, id: "view_back", model_view: "back", view_index: 3}
  - {<<: *view, id: "view_left", model_view: "left", view_index: 4}
  - {<<: *view, id: "view_right", model_view: "right", view_index: 5}
