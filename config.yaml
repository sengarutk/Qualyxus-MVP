paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  events_dir: "data/events"
  reports_dir: "data/reports"
  models_dir: "models/checkpoints"
  exported_dir: "models/exported"

active_profile: "default"

dataset:
  name: "active_product_recipe"
  format: "masks"
  raw_path: "data/raw/active_dataset"
  val_split: 0.20
  seed: 42
  min_contour_area: 25
  classes:
    0: "defect"

inference:
  model_path: "models/checkpoints/default/best.pt"
  yolo_yaml: "data/processed/active_recipe.yaml"
  conf: 0.35
  iou: 0.5
  skip_frames: 1

training:
  model: "yolov8s-seg.pt"
  epochs: 30
  imgsz: 640
  batch: 8
  device: 0

logging:
  sqlite_path: "data/events/events.db"
  csv_path: "data/events/events.csv"

mqtt:
  agentic_enabled: false
  host: "127.0.0.1"
  port: 1883
  keepalive: 60
  qos: 1
  retain: false
  topic_root: "qualyxus/agentic"
  client_id: "qualyxus-agentic-gateway"
  reconnect_backoff_seconds: 30
  evaluation_queue_size: 128

telemetry:
  mode: "simulated"
  protocol: "modbus"
  endpoint: null
  register_map: null

hardware_acceleration:
  use_triton: true
  precision: "fp16"

vlm_reasoning:
  enabled: true
  model: "moondream2"
  local_api: "http://localhost:11434"
  timeout_seconds: 10
  backend: "ollama"

esg_params:
  material_density_kg_per_unit: 0.5
  unit_cost_usd: 12.5
  carbon_coefficient_kg_co2_per_kg: 2.5
  currency_symbol: "$"
  line_overrides: {}

synthetic_generation:
  model_type: "inpainting"
  device: "cuda"
  batch_size: 4
  output_resolution: [640, 640]

federated_learning:
  enabled: true
  privacy_level: "maximum"
  sync_interval_hours: 24

camera_settings:
  use_gstreamer: true
  hardware_platform: "nvidia"
  buffer_size: 1

resource_management:
  monitoring_interval: 2.0
  vram_thresholds:
    warning: 85
    critical: 95
  temp_thresholds:
    warning: 78
    critical: 85

camera_manager:
  monitor_interval: 1.0
  health_timeout: 4.0
  restart_backoff: 0.5

watchdog:
  heartbeat_timeout: 10.0
  frame_drop_threshold: 200
  queue_overflow_streak_threshold: 25
  base_backoff: 1.0
  max_backoff: 30.0

disk_monitor:
  watch_path: "data"
  interval_seconds: 30.0
  warning_threshold: 15.0
  critical_threshold: 10.0

log_health:
  retry_attempts: 3
  retry_delay: 0.2
  queue_growth_limit: 8

runtime_metrics:
  output_path: "data/runtime/runtime_metrics.json"
  interval_seconds: 10.0

hardening:
  max_pending_events: 100
  logger_stall_timeout: 5.0
  max_events_per_sec: 10.0

test_flags:
  simulate_camera_drop: false
  simulate_disk_full: false
  simulate_slow_writes: false

camera:
  fps: 30
  width: 640
  height: 480
  reconnect_delay: 1.0
  save_every: 10
  jpeg_quality: 90
  frame_queue_size: 8
  event_queue_size: 64
  raw_dir: "data/live/raw"
  defect_dir: "data/live/defects"

# ✅ BLENDER RTSP STREAM ROUTING (TOP, BOTTOM, FRONT, BACK)
cameras:
  - id: "cam_0"
    enabled: true
    source: "rtsp://127.0.0.1:8554/cam_0"
    mock_inference: false
    independent_logs: true
    fps: 30
    width: 640
    height: 480
    frame_queue_size: 8
    event_queue_size: 64
    jpeg_quality: 90

  - id: "cam_1"
    enabled: true
    source: "rtsp://127.0.0.1:8554/cam_1"
    mock_inference: false
    independent_logs: true
    fps: 30
    width: 640
    height: 480
    frame_queue_size: 8
    event_queue_size: 64
    jpeg_quality: 90

  - id: "cam_2"
    enabled: true
    source: "rtsp://127.0.0.1:8554/cam_2"
    mock_inference: false
    independent_logs: true
    fps: 30
    width: 640
    height: 480
    frame_queue_size: 8
    event_queue_size: 64
    jpeg_quality: 90

  - id: "cam_3"
    enabled: true
